<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bogong Out! 🦋</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121729;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;justify-content:center;min-height:100vh;padding:18px}.wrap{width:min(920px,100%)}h1{margin:8px 0 4px;text-align:center}.sub{text-align:center;color:#b9c5e0;margin:0 0 14px}.hud{display:flex;justify-content:space-around;gap:8px;background:#27304b;padding:12px;border-radius:14px;margin-bottom:12px;font-weight:700}.hud strong{color:#ffce74}.game{position:relative;height:min(65vh,510px);min-height:350px;border:5px solid #6b7394;border-radius:20px;overflow:hidden;touch-action:none;user-select:none;background:linear-gradient(#343b60 0%,#596080 75%,#857a7c 75%,#857a7c 100%);box-shadow:0 15px 40px #0005}.game:before{content:"";position:absolute;left:5%;bottom:25%;width:110px;height:140px;background:#272e48;border-radius:60px 60px 0 0;opacity:.55}.window{position:absolute;right:4%;top:9%;width:25%;height:53%;background:linear-gradient(145deg,#122544,#3f6798);border:12px solid #ead9b7;border-radius:7px;box-shadow:0 0 0 4px #4e4a59,0 0 40px #d9e5ff55 inset}.window:before{content:"";position:absolute;left:48%;top:0;height:100%;width:8px;background:#ead9b7}.window:after{content:"";position:absolute;top:48%;left:0;width:100%;height:8px;background:#ead9b7}.moon{position:absolute;right:12%;top:18%;font-size:38px}.window-label{position:absolute;right:5%;top:65%;font-size:13px;color:#fffbd6}.moth{position:absolute;width:66px;height:55px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;z-index:4;filter:drop-shadow(0 5px 4px #0007)}.moth svg{width:100%;height:100%;overflow:visible}.moth.held{cursor:grabbing;filter:drop-shadow(0 0 14px #ffe6a9)}.moth.held svg{transform:scale(1.15)}.overlay{position:absolute;inset:0;z-index:10;background:#141b31dc;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay.hidden{display:none}.overlay h2{font-size:30px;margin:0 0 12px}.overlay p{line-height:1.7;max-width:430px}.btn{border:0;border-radius:12px;padding:12px 22px;background:#ffbd68;color:#262031;font-size:16px;font-weight:800;cursor:pointer}.btn:hover{background:#ffd18d}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.message{color:#f8d9a6;font-weight:600}.help{color:#aebbd5;font-size:13px;line-height:1.7}#particles{position:absolute;inset:0;pointer-events:none;z-index:6}.particle{position:absolute;font-size:24px;animation:pop .7s ease-out forwards}@keyframes pop{to{opacity:0;transform:translateY(-65px) scale(1.5)}}@media(max-width:540px){.hud{font-size:13px}.game{min-height:410px}.window{width:34%;right:3%}.window-label{right:3%}.moth{width:60px;height:50px}}
</style>
</head>
<body><main class="wrap"><h1>🦋 Bogong Out!</h1><p class="sub">抓住闯进房间的 Bogong moth，把它们扔出窗外！</p><div class="hud"><span>⭐ 分数：<strong id="score">0</strong></span><span>⏳ 剩余：<strong id="time">60</strong>s</span><span>🏆 最高分：<strong id="best">0</strong></span></div><section class="game" id="game"><div class="window" id="window"><span class="moon">🌙</span></div><span class="window-label">↗ 朝窗户扔！</span><div id="particles"></div><div class="moth" id="moth" aria-label="Bogong moth"><svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg"><path d="M49 28 Q19 -4 3 14 Q-2 33 43 51 L49 41Z" fill="#a88968" stroke="#4b392f" stroke-width="3"/><path d="M51 28 Q81 -4 97 14 Q102 33 57 51 L51 41Z" fill="#a88968" stroke="#4b392f" stroke-width="3"/><path d="M44 42 Q10 37 19 68 Q36 76 49 51Z" fill="#765c4b" stroke="#4b392f" stroke-width="2"/><path d="M56 42 Q90 37 81 68 Q64 76 51 51Z" fill="#765c4b" stroke="#4b392f" stroke-width="2"/><path d="M50 25 Q44 39 47 61 Q50 69 53 61 Q56 39 50 25Z" fill="#382c29"/><path d="M47 28 Q40 16 36 15 M53 28 Q60 16 64 15" fill="none" stroke="#382c29" stroke-width="2"/><circle cx="23" cy="24" r="4" fill="#e8c59a"/><circle cx="77" cy="24" r="4" fill="#e8c59a"/></svg></div><div class="overlay" id="overlay"><h2 id="overlay-title">🦋 Bogong Out!</h2><p id="overlay-text">按住蛾子，快速向窗户拖动后松手，把它抛出房间。<br>每成功放飞一只获得 10 分！<br>你有 60 秒。</p><button class="btn" id="start">开始游戏</button></div></section><div class="bottom"><span class="message" id="message">准备好了吗？</span><button class="btn" id="restart">重新开始 ↻</button></div><p class="help">操作：鼠标左键或手指按住蛾子，朝右上角窗户快速滑动并松手。慢慢拖进窗户也能成功。游戏不需要联网。</p></main>
<script>
(()=>{'use strict';
const game=document.querySelector('#game'),moth=document.querySelector('#moth'),windowEl=document.querySelector('#window'),overlay=document.querySelector('#overlay'),message=document.querySelector('#message'),particles=document.querySelector('#particles');
const scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),bestEl=document.querySelector('#best');
let score=0,remaining=60,running=false,held=false,thrown=false,x=40,y=130,vx=0,vy=0,lastFrame=0,secondAccumulator=0,flightTime=0,history=[],frameId=0;
let best=0;try{best=Number(localStorage.getItem('bogong-best')||0)}catch(e){}bestEl.textContent=best;
const size=()=>({w:moth.offsetWidth,h:moth.offsetHeight});
function show(){moth.style.transform=`translate(${x}px,${y}px) rotate(${Math.max(-25,Math.min(25,vx*2))}deg)`}
function spawn(){const {w,h}=size();x=20+Math.random()*Math.max(20,game.clientWidth*.48-w);y=45+Math.random()*Math.max(20,game.clientHeight*.68-h);vx=(Math.random()>.5?1:-1)*(65+Math.random()*65);vy=(Math.random()>.5?1:-1)*(50+Math.random()*60);held=false;thrown=false;flightTime=0;history=[];show()}
function update(){scoreEl.textContent=score;timeEl.textContent=remaining;bestEl.textContent=best}
function start(){cancelAnimationFrame(frameId);score=0;remaining=60;secondAccumulator=0;running=true;held=false;thrown=false;lastFrame=0;overlay.classList.add('hidden');message.textContent='抓住它！';spawn();update();frameId=requestAnimationFrame(loop)}
function finish(){running=false;held=false;thrown=false;cancelAnimationFrame(frameId);overlay.classList.remove('hidden');document.querySelector('#overlay-title').textContent='⏰ 时间到！';document.querySelector('#overlay-text').textContent=`你成功放飞 ${score/10} 只 Bogong moth，获得 ${score} 分！`;document.querySelector('#start').textContent='再玩一次';message.textContent='游戏结束！'}
function sparkle(){const a=moth.getBoundingClientRect(),b=game.getBoundingClientRect();for(let i=0;i<5;i++){const p=document.createElement('span');p.className='particle';p.textContent='✨';p.style.left=(a.left-b.left+Math.random()*60)+'px';p.style.top=(a.top-b.top+Math.random()*40)+'px';particles.append(p);setTimeout(()=>p.remove(),750)}}
function success(){sparkle();score+=10;if(score>best){best=score;try{localStorage.setItem('bogong-best',String(best))}catch(e){}}update();message.textContent=['飞出去啦！+10 🎉','漂亮的一扔！+10','Bogong 自由了！+10'][Math.floor(Math.random()*3)];spawn()}
function insideWindow(){const a=moth.getBoundingClientRect(),b=windowEl.getBoundingClientRect();const cx=a.left+a.width/2,cy=a.top+a.height/2;return cx>b.left+5&&cx<b.right-5&&cy>b.top+5&&cy<b.bottom-5}
function loop(t){if(!running)return;if(!lastFrame)lastFrame=t;const dt=Math.min((t-lastFrame)/1000,.05);lastFrame=t;secondAccumulator+=dt;if(secondAccumulator>=1){const s=Math.floor(secondAccumulator);remaining=Math.max(0,remaining-s);secondAccumulator-=s;update();if(remaining===0){finish();return}}
if(!held){const {w,h}=size();if(thrown){flightTime+=dt;vy+=260*dt;x+=vx*dt;y+=vy*dt;vx*=Math.pow(.985,dt*60);if(insideWindow()){success()}else if(x>game.clientWidth+70||y>game.clientHeight+70||y< -100||flightTime>2.2){message.textContent='没扔中！再来一次';spawn()}}else{x+=vx*dt;y+=vy*dt;if(x<5||x>game.clientWidth-w-5){vx=-vx;x=Math.max(5,Math.min(game.clientWidth-w-5,x))}if(y<5||y>game.clientHeight-h-55){vy=-vy;y=Math.max(5,Math.min(game.clientHeight-h-55,y))}}show()}
frameId=requestAnimationFrame(loop)}
function pointerPos(e){const r=game.getBoundingClientRect();return {x:e.clientX-r.left-moth.offsetWidth/2,y:e.clientY-r.top-moth.offsetHeight/2}}
moth.addEventListener('pointerdown',e=>{if(!running)return;e.preventDefault();held=true;thrown=false;history=[];moth.classList.add('held');moth.setPointerCapture(e.pointerId);const p=pointerPos(e);x=p.x;y=p.y;history.push({x,y,t:performance.now()});show();message.textContent='抓到了！朝窗户扔！'});
moth.addEventListener('pointermove',e=>{if(!held)return;e.preventDefault();const p=pointerPos(e);x=p.x;y=p.y;const now=performance.now();history.push({x,y,t:now});history=history.filter(v=>now-v.t<130);show()});
function release(e){if(!held)return;held=false;moth.classList.remove('held');if(insideWindow()){success();return}const now=performance.now();const old=history.find(v=>now-v.t<110)||history[0];const duration=Math.max(16,now-old.t);vx=Math.max(-1100,Math.min(1100,(x-old.x)/duration*1000));vy=Math.max(-1100,Math.min(1100,(y-old.y)/duration*1000));thrown=true;flightTime=0;message.textContent='飞吧，Bogong！'}
moth.addEventListener('pointerup',release);moth.addEventListener('pointercancel',release);
document.querySelector('#start').addEventListener('click',start);document.querySelector('#restart').addEventListener('click',start);window.addEventListener('resize',()=>{if(!held&&!thrown){x=Math.min(x,game.clientWidth-moth.offsetWidth);show()}});spawn();update();
})();
</script></body></html>
